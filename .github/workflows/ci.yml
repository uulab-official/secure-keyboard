name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.88.0 MSRV
        with:
          toolchain: 1.88.0
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-features
      - run: cargo +1.88.0 test --locked --workspace --all-features
      - run: cargo test --locked -p secure-webauthn-example
      - run: cargo test --locked -p secure-auth-axum --all-features
      - run: cargo test --locked -p secure-auth-actix --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Audit Rust dependencies with pinned RustSec tooling
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  durable-backends:
    name: Redis/PostgreSQL interoperability
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Run isolated durable backend interoperability tests
        env:
          SECURE_KEYPAD_REDIS_URL: redis://127.0.0.1:6379
          SECURE_KEYPAD_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
        run: cargo test --locked -p secure-webauthn-example --all-features --test durable_storage -- --ignored --nocapture
      - name: Run isolated distributed rate-limit interoperability tests
        env:
          SECURE_KEYPAD_REDIS_URL: redis://127.0.0.1:6379
          SECURE_KEYPAD_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
        run: cargo test --locked -p secure-auth-server --all-features --test durable_rate_limit -- --ignored --nocapture
      - name: Run isolated distributed OPAQUE one-time-state interoperability tests
        env:
          SECURE_KEYPAD_REDIS_URL: redis://127.0.0.1:6379
          SECURE_KEYPAD_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
        run: cargo test --locked -p secure-auth-server --all-features --test durable_one_time_state -- --ignored --nocapture
      - name: Emit durable backend CI release evidence
        run: |
          node scripts/emit-ci-gate-evidence.mjs \
            "$RUNNER_TEMP/secure-keypad-ci-evidence" \
            durable-backends \
            "ci/durable-backends.json" \
            "fragments/durable-backends.json" \
            --runner ubuntu-24.04 \
            --check durable_storage \
            --check durable_rate_limit \
            --check durable_one_time_state
      - uses: actions/upload-artifact@ea165f8f65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secure-keypad-ci-gate-durable-backends
          path: ${{ runner.temp }}/secure-keypad-ci-evidence
          if-no-files-found: warn

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm test:native-parity
      - run: pnpm check:native-parity
      - run: pnpm test:http-contract-version-parity
      - run: pnpm check:http-contract-version-parity
      - run: pnpm test:opaque-protocol-parity
      - run: pnpm check:opaque-protocol-parity
      - run: pnpm test:ios-host-build-contract
      - run: pnpm test:flutter-package-publish-contract
      - run: pnpm test:release-version-parity
      - run: pnpm check:release-version-parity
      - run: pnpm test:release-evidence
      - run: pnpm test:release-bundle
      - run: pnpm test:release-archive
      - run: pnpm test:msrv-contract
      - run: pnpm test:release-candidate-metadata
      - run: pnpm test:stage-release-evidence
      - run: pnpm test:release-fragment-set
      - run: pnpm test:verify-github-run-provenance
      - run: pnpm test:verify-lsan-evidence
      - run: pnpm test:expo-development-build
      - run: pnpm test:emit-release-gate-evidence
      - run: pnpm test:emit-release-artifact-fragment
      - run: pnpm test:emit-native-device-evidence
      - run: pnpm test:emit-ci-gate-evidence
      - run: pnpm test:emit-web-browser-evidence
      - run: pnpm test:merge-release-evidence
      - run: pnpm test:sign-release
      - run: pnpm test:emit-signed-release-evidence
      - run: pnpm test:emit-independent-review-fragment
      - run: pnpm test:external-release-evidence
      - run: pnpm test:device-evidence
      - run: pnpm test:platform-support
      - run: pnpm test:fuzz-corpus
      - run: pnpm test:security-audit
      - run: pnpm security-audit
      - run: pnpm --dir packages/contracts typecheck
      - run: pnpm --dir packages/contracts test
      - run: pnpm --dir packages/contracts build
      - run: pnpm --dir packages/react-native typecheck
      - run: pnpm --dir packages/react-native test
      - run: pnpm --dir packages/react-native build
      - run: pnpm --dir packages/react-native pack --dry-run
      - run: pnpm --dir packages/web typecheck
      - run: pnpm --dir packages/web test
      - run: pnpm --dir packages/web build
      - run: pnpm --dir packages/server-node typecheck
      - run: pnpm --dir packages/server-node test
      - run: pnpm --dir packages/server-node build
      - run: pnpm --dir packages/server-node pack --dry-run
      - run: pnpm --dir packages/contracts pack --dry-run
      - run: pnpm --dir packages/web pack --dry-run

  web-browser-matrix:
    name: Web adapter runtime smoke (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/web build
      - name: Install the pinned Playwright browser and system dependencies
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Run browser smoke and retain sanitized evidence
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/secure-keypad-browser-smoke"
          pnpm test:web-browser "${{ matrix.browser }}" 2>&1 \
            | tee "$RUNNER_TEMP/secure-keypad-browser-smoke/${{ matrix.browser }}.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secure-keypad-browser-smoke-${{ matrix.browser }}
          path: ${{ runner.temp }}/secure-keypad-browser-smoke/${{ matrix.browser }}.log
          if-no-files-found: error

  flutter:
    name: Validate Flutter contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
        working-directory: packages/flutter
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: packages/flutter
      - run: flutter analyze
        working-directory: packages/flutter
      - run: flutter test
        working-directory: packages/flutter
      - run: dart pub publish --dry-run
        working-directory: packages/flutter

  flutter-host-build:
    name: Compile Flutter Android host integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build the matching Android arm64 FFI library
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_VERSION="27.1.12297006"
          test -n "$SDK_ROOT"
          ANDROID_NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi
          test -d "$ANDROID_NDK_ROOT"
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --locked --release -p secure-ffi --target aarch64-linux-android
          mkdir -p "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a"
          cp target/aarch64-linux-android/release/libsecure_ffi.a \
            "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a/libsecure_ffi.a"
          test -x "$NDK_BIN/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android24-clang"
          cargo build --locked --release -p secure-ffi --target x86_64-linux-android
          mkdir -p "$RUNNER_TEMP/secure-keypad-ffi/x86_64"
          cp target/x86_64-linux-android/release/libsecure_ffi.a \
            "$RUNNER_TEMP/secure-keypad-ffi/x86_64/libsecure_ffi.a"
      - name: Create an ephemeral host app using the publishable Flutter plugin
        env:
          HOST_DIR: ${{ runner.temp }}/secure-keypad-flutter-host
        run: |
          flutter create --platforms=android --org dev.uulab --project-name secure_keypad_host "$HOST_DIR"
          python3 - <<'PY'
          import os
          from pathlib import Path

          host = Path(os.environ["HOST_DIR"])
          pubspec = host / "pubspec.yaml"
          contents = pubspec.read_text()
          dependency = (
              "dependencies:\n"
              "  secure_keypad_flutter:\n"
              f"    path: {Path(os.environ['GITHUB_WORKSPACE']) / 'packages/flutter'}\n"
          )
          pubspec.write_text(contents.replace("dependencies:\n", dependency, 1))
          app_gradle = host / "android/app/build.gradle"
          if not app_gradle.exists():
              app_gradle = host / "android/app/build.gradle.kts"
          if app_gradle.exists():
              gradle = app_gradle.read_text()
              gradle = gradle.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              gradle = gradle.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              app_gradle.write_text(gradle)
          (host / "lib/main.dart").write_text('''
          import 'package:flutter/material.dart';
          import 'package:secure_keypad_flutter/secure_keypad_flutter.dart';

          void main() => runApp(const SecureKeypadHostSmoke());

          class SecureKeypadHostSmoke extends StatelessWidget {
            const SecureKeypadHostSmoke({super.key});

            @override
            Widget build(BuildContext context) {
              final controller = SecureKeypadController();
              return MaterialApp(
                home: Scaffold(
                  body: SecureKeypad(
                    configuration: SecureKeypadConfiguration.defaultNumeric(),
                    controller: controller,
                  ),
                ),
              );
            }
          }
          ''')
          PY
      - name: Stage bundled Flutter Android FFI artifacts
        run: |
          mkdir -p packages/flutter/android/secure_ffi
          cp -R "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a" packages/flutter/android/secure_ffi/arm64-v8a
          cp -R "$RUNNER_TEMP/secure-keypad-ffi/x86_64" packages/flutter/android/secure_ffi/x86_64
          test -s packages/flutter/android/secure_ffi/arm64-v8a/libsecure_ffi.a
          test -s packages/flutter/android/secure_ffi/x86_64/libsecure_ffi.a
      - name: Build the Flutter host APK with the native FFI boundary
        working-directory: ${{ runner.temp }}/secure-keypad-flutter-host
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64,android-x64
      - name: Emit Flutter Android FFI checksum manifest
        run: |
          (
            cd "$RUNNER_TEMP/secure-keypad-ffi"
            shasum -a 256 arm64-v8a/libsecure_ffi.a x86_64/libsecure_ffi.a
          ) > "$RUNNER_TEMP/secure-keypad-ffi/secure-ffi-android-host-architectures.sha256"
          cat "$RUNNER_TEMP/secure-keypad-ffi/secure-ffi-android-host-architectures.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-ffi-android-flutter-host-and-checksum
          path: ${{ runner.temp }}/secure-keypad-ffi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-flutter-host-apk
          path: ${{ runner.temp }}/secure-keypad-flutter-host/build/app/outputs/flutter-apk/app-debug.apk

  react-native-host-build:
    name: Compile React Native Android host integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/contracts build
      - run: pnpm --dir packages/react-native build
      - name: Build the matching Android arm64 FFI library
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_VERSION="27.1.12297006"
          test -n "$SDK_ROOT"
          ANDROID_NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi
          test -d "$ANDROID_NDK_ROOT"
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --locked --release -p secure-ffi --target aarch64-linux-android
          mkdir -p "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a"
          cp target/aarch64-linux-android/release/libsecure_ffi.a \
            "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a/libsecure_ffi.a"
          test -x "$NDK_BIN/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android24-clang"
          cargo build --locked --release -p secure-ffi --target x86_64-linux-android
          mkdir -p "$RUNNER_TEMP/secure-keypad-ffi/x86_64"
          cp target/x86_64-linux-android/release/libsecure_ffi.a \
            "$RUNNER_TEMP/secure-keypad-ffi/x86_64/libsecure_ffi.a"
      - name: Create an ephemeral host app using the publishable React Native package
        env:
          HOST_DIR: ${{ runner.temp }}/secure-keypad-react-native-host
          RN_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-react-native-package
          CONTRACTS_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-contracts-package
        run: |
          npx --yes @react-native-community/cli@20.2.0 init SecureKeypadHost \
            --version 0.87.0 --directory "$HOST_DIR" --skip-install
          mkdir -p "$RN_PACKAGE_DIR" "$CONTRACTS_PACKAGE_DIR"
          cp -R "$GITHUB_WORKSPACE/packages/react-native/." "$RN_PACKAGE_DIR/"
          cp -R "$GITHUB_WORKSPACE/packages/contracts/." "$CONTRACTS_PACKAGE_DIR/"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          host = Path(os.environ["HOST_DIR"])
          rn_package = Path(os.environ["RN_PACKAGE_DIR"])
          contracts_package = Path(os.environ["CONTRACTS_PACKAGE_DIR"])

          rn_manifest_path = rn_package / "package.json"
          rn_manifest = json.loads(rn_manifest_path.read_text())
          rn_manifest["dependencies"]["@secure-keypad/contracts"] = f"file:{contracts_package}"
          rn_manifest_path.write_text(json.dumps(rn_manifest, indent=2) + "\n")

          host_manifest_path = host / "package.json"
          host_manifest = json.loads(host_manifest_path.read_text())
          host_manifest.setdefault("dependencies", {})["@secure-keypad/react-native"] = f"file:{rn_package}"
          host_manifest_path.write_text(json.dumps(host_manifest, indent=2) + "\n")

          (host / "App.tsx").write_text('''
          import React from 'react';
          import { SafeAreaView, StyleSheet } from 'react-native';
          import { getSecureKeypadView } from '@secure-keypad/react-native';
          import { DEFAULT_NUMERIC_LAYOUT, DEFAULT_THEME } from '@secure-keypad/contracts';

          const SecureKeypadView = getSecureKeypadView();

          export default function App() {
            return (
              <SafeAreaView style={styles.root}>
                <SecureKeypadView
                  style={styles.keypad}
                  layout={DEFAULT_NUMERIC_LAYOUT}
                  theme={DEFAULT_THEME}
                  inputPolicy="numeric"
                  maxTokens={8}
                  timeoutMs={60000}
                  cancelRequest={0}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({ root: { flex: 1 }, keypad: { flex: 1 } });
          ''')
          PY
      - name: Stage bundled React Native Android FFI artifacts
        env:
          RN_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-react-native-package
        run: |
          mkdir -p "$RN_PACKAGE_DIR/android/secure_ffi"
          cp -R "$RUNNER_TEMP/secure-keypad-ffi/arm64-v8a" "$RN_PACKAGE_DIR/android/secure_ffi/arm64-v8a"
          cp -R "$RUNNER_TEMP/secure-keypad-ffi/x86_64" "$RN_PACKAGE_DIR/android/secure_ffi/x86_64"
          test -s "$RN_PACKAGE_DIR/android/secure_ffi/arm64-v8a/libsecure_ffi.a"
          test -s "$RN_PACKAGE_DIR/android/secure_ffi/x86_64/libsecure_ffi.a"
      - name: Build the React Native host APK with the native FFI boundary
        working-directory: ${{ runner.temp }}/secure-keypad-react-native-host
        run: |
          npm install --install-links --no-audit --no-fund
          npx react-native config > "$RUNNER_TEMP/react-native-config.json"
          grep -q '"@secure-keypad/react-native"' "$RUNNER_TEMP/react-native-config.json"
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Emit React Native Android FFI checksum manifest
        run: |
          (
            cd "$RUNNER_TEMP/secure-keypad-ffi"
            shasum -a 256 arm64-v8a/libsecure_ffi.a x86_64/libsecure_ffi.a
          ) > "$RUNNER_TEMP/secure-keypad-ffi/secure-ffi-android-host-architectures.sha256"
          cat "$RUNNER_TEMP/secure-keypad-ffi/secure-ffi-android-host-architectures.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-ffi-android-react-native-host-and-checksum
          path: ${{ runner.temp }}/secure-keypad-ffi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-react-native-host-apk
          path: ${{ runner.temp }}/secure-keypad-react-native-host/android/app/build/outputs/apk/release/app-release.apk

  android-host-runtime-smoke:
    name: Launch Android RN and Flutter hosts in an emulator
    needs: [flutter-host-build, react-native-host-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-flutter-host-apk
          path: ${{ runner.temp }}/secure-keypad-android-runtime/flutter
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-react-native-host-apk
          path: ${{ runner.temp }}/secure-keypad-android-runtime/react-native
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-secure-keypad-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch both host APKs in Android API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash "$GITHUB_WORKSPACE/scripts/android-emulator-runtime-smoke.sh" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/flutter/app-debug.apk" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/flutter.png" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/flutter-ui.xml"
            bash "$GITHUB_WORKSPACE/scripts/android-emulator-runtime-smoke.sh" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/react-native/app-release.apk" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/react-native.png" \
              "$RUNNER_TEMP/secure-keypad-android-runtime/react-native-ui.xml"
      - name: Upload Android emulator runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-android-emulator-runtime
          path: ${{ runner.temp }}/secure-keypad-android-runtime
          if-no-files-found: warn

  fuzz:
    name: Fuzz parser, core, and native boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZ_CORPUS_ROOT: ${{ runner.temp }}/secure-keypad-fuzz-corpus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-08-19 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-19 install cargo-fuzz --locked
      - name: Prepare fuzz evidence log directory
        run: mkdir -p "$RUNNER_TEMP/secure-keypad-fuzz-logs"
      - name: Stage fuzz corpus outside the clean checkout
        run: scripts/stage-fuzz-corpus.sh "$FUZZ_CORPUS_ROOT"
      - name: Build fuzz target
        run: cargo +nightly-2026-08-19 fuzz check auth_envelope
      - name: Run bounded fuzz smoke test
        run: cargo +nightly-2026-08-19 fuzz run auth_envelope "$FUZZ_CORPUS_ROOT/auth_envelope" -- -runs=2000
      - name: Build native/core fuzz target
        run: cargo +nightly-2026-08-19 fuzz check core_sequence
      - name: Run bounded native/core fuzz smoke test
        run: cargo +nightly-2026-08-19 fuzz run core_sequence "$FUZZ_CORPUS_ROOT/core_sequence" -- -runs=2000
      - name: Build native FFI boundary fuzz target
        run: cargo +nightly-2026-08-19 fuzz check ffi_sequence
      - name: Run bounded native FFI boundary fuzz smoke test
        run: cargo +nightly-2026-08-19 fuzz run ffi_sequence "$FUZZ_CORPUS_ROOT/ffi_sequence" -- -runs=2000 -max_len=4096
      - name: Build WebAuthn state fuzz target
        run: cargo +nightly-2026-08-19 fuzz check webauthn_state
      - name: Run bounded WebAuthn state fuzz smoke test
        run: cargo +nightly-2026-08-19 fuzz run webauthn_state "$FUZZ_CORPUS_ROOT/webauthn_state" -- -runs=2000 -max_len=131073
      - name: Run extended parser and native-boundary stability campaigns
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-19 fuzz run auth_envelope "$FUZZ_CORPUS_ROOT/auth_envelope" -- -runs=1000000 -max_len=4096 -rss_limit_mb=1024 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/auth_envelope-1m.log"
          cargo +nightly-2026-08-19 fuzz run core_sequence "$FUZZ_CORPUS_ROOT/core_sequence" -- -runs=1000000 -max_len=4096 -rss_limit_mb=1024 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/core_sequence-1m.log"
          cargo +nightly-2026-08-19 fuzz run ffi_sequence "$FUZZ_CORPUS_ROOT/ffi_sequence" -- -runs=1000000 -max_len=4096 -rss_limit_mb=1024 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/ffi_sequence-1m.log"
          cargo +nightly-2026-08-19 fuzz run webauthn_state "$FUZZ_CORPUS_ROOT/webauthn_state" -- -runs=1000000 -max_len=131073 -rss_limit_mb=1024 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/webauthn_state-1m.log"
      - name: Run Linux leak-sanitizer fuzz smoke campaigns
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-19 fuzz run auth_envelope "$FUZZ_CORPUS_ROOT/auth_envelope" --sanitizer=leak -- -runs=10000 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/auth_envelope-lsan.log"
          printf '%s\n' 'SECURE_KEYPAD_LSAN_RESULT target=auth_envelope toolchain=nightly-2026-08-19 sanitizer=leak runs=10000 status=pass' >> "$RUNNER_TEMP/secure-keypad-fuzz-logs/auth_envelope-lsan.log"
          cargo +nightly-2026-08-19 fuzz run core_sequence "$FUZZ_CORPUS_ROOT/core_sequence" --sanitizer=leak -- -runs=10000 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/core_sequence-lsan.log"
          printf '%s\n' 'SECURE_KEYPAD_LSAN_RESULT target=core_sequence toolchain=nightly-2026-08-19 sanitizer=leak runs=10000 status=pass' >> "$RUNNER_TEMP/secure-keypad-fuzz-logs/core_sequence-lsan.log"
          cargo +nightly-2026-08-19 fuzz run ffi_sequence "$FUZZ_CORPUS_ROOT/ffi_sequence" --sanitizer=leak -- -runs=10000 -max_len=4096 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/ffi_sequence-lsan.log"
          printf '%s\n' 'SECURE_KEYPAD_LSAN_RESULT target=ffi_sequence toolchain=nightly-2026-08-19 sanitizer=leak runs=10000 status=pass' >> "$RUNNER_TEMP/secure-keypad-fuzz-logs/ffi_sequence-lsan.log"
          cargo +nightly-2026-08-19 fuzz run webauthn_state "$FUZZ_CORPUS_ROOT/webauthn_state" --sanitizer=leak -- -runs=10000 -max_len=131073 \
            2>&1 | tee "$RUNNER_TEMP/secure-keypad-fuzz-logs/webauthn_state-lsan.log"
          printf '%s\n' 'SECURE_KEYPAD_LSAN_RESULT target=webauthn_state toolchain=nightly-2026-08-19 sanitizer=leak runs=10000 status=pass' >> "$RUNNER_TEMP/secure-keypad-fuzz-logs/webauthn_state-lsan.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secure-keypad-fuzz-logs-pre-evidence
          path: ${{ runner.temp }}/secure-keypad-fuzz-logs

      - name: Emit fuzz CI release evidence
        run: |
          node scripts/emit-ci-gate-evidence.mjs \
            "$RUNNER_TEMP/secure-keypad-ci-evidence" \
            fuzz-stability \
            "ci/fuzz-stability.json" \
            "fragments/fuzz-stability.json" \
            --runner ubuntu-24.04 \
            --check auth_envelope \
            --check core_sequence \
            --check ffi_sequence \
            --check webauthn_state
          node scripts/emit-lsan-gate-evidence.mjs \
            "$RUNNER_TEMP/secure-keypad-fuzz-logs" \
            "$RUNNER_TEMP/secure-keypad-ci-evidence" \
            "ci/linux-leak-sanitizer.json" \
            "fragments/linux-leak-sanitizer.json" \
            --runner ubuntu-24.04
      - uses: actions/upload-artifact@ea165f8f65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secure-keypad-ci-gate-fuzz
          path: ${{ runner.temp }}/secure-keypad-ci-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8f65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secure-keypad-fuzz-logs
          path: ${{ runner.temp }}/secure-keypad-fuzz-logs
  sbom:
    name: Produce dependency SBOM artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate dependency metadata
        run: |
          mkdir -p artifacts
          cargo metadata --locked --format-version 1 > artifacts/cargo-metadata.json
          pnpm list --depth=-1 --json > artifacts/pnpm-dependencies.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: secure-keypad.sbom.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-dependency-metadata
          path: artifacts/

  ffi-header:
    name: Validate C ABI header
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compile header contract
        run: cc -std=c11 -Wall -Wextra -Werror -Icrates/secure-ffi/include -fsyntax-only crates/secure-ffi/tests/header_contract.c

  native-platforms:
    name: Validate native platform contracts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build release FFI libraries for device and simulator
        run: |
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios-sim
      - name: Assemble and inspect the release XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -library target/aarch64-apple-ios-sim/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -output "$RUNNER_TEMP/secure_ffi.xcframework"
          plutil -extract AvailableLibraries xml1 -o - "$RUNNER_TEMP/secure_ffi.xcframework/Info.plist"
      - name: Emit native artifact checksum manifest
        run: |
          (
            cd "$RUNNER_TEMP/secure_ffi.xcframework"
            find . -type f -print0 \
              | sort -z \
              | xargs -0 shasum -a 256
          ) > "$RUNNER_TEMP/secure_ffi.xcframework.sha256"
          cat "$RUNNER_TEMP/secure_ffi.xcframework.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-ffi-xcframework-and-checksum
          path: |
            ${{ runner.temp }}/secure_ffi.xcframework
            ${{ runner.temp }}/secure_ffi.xcframework.sha256
      - name: Stage XCFramework for package Podspec validation
        run: |
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" packages/react-native/secure_ffi.xcframework
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" packages/flutter/ios/secure_ffi.xcframework
      - name: Parse package Podspecs against the release XCFramework
        run: |
          SECURE_KEYPAD_FFI_XCFRAMEWORK="$RUNNER_TEMP/secure_ffi.xcframework" \
            pod ipc spec packages/react-native/SecureKeypadReactNative.podspec >/tmp/secure-keypad-rn-podspec.json
          SECURE_KEYPAD_FFI_XCFRAMEWORK="$RUNNER_TEMP/secure_ffi.xcframework" \
            pod ipc spec packages/flutter/ios/secure_keypad_flutter.podspec >/tmp/secure-keypad-flutter-podspec.json
      - name: Swift presentation snapshot contract
        run: |
          swiftc -warnings-as-errors \
            native/ios/SecureKeypadPresentation.swift \
            native/ios/SecureKeypadPresentationContractTest.swift \
            -o /tmp/secure-keypad-presentation-contract
          /tmp/secure-keypad-presentation-contract
      - name: Swift iOS typecheck
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swiftc -warnings-as-errors -typecheck \
            -sdk "$IOS_SDK" \
            -target arm64-apple-ios26.0 \
            -I native/ios/SecureKeypadFFI \
            native/ios/SecureKeypadPresentation.swift \
            native/ios/SecureKeypadBridgeConfig.swift \
            native/ios/SecureKeypadView.swift
      - name: Android Kotlin typecheck
        run: |
          ANDROID_ROOT="$HOME/Library/Android/sdk"
          if [ -n "$ANDROID_HOME" ]; then ANDROID_ROOT="$ANDROID_HOME"; fi
          ANDROID_JAR="$(find "$ANDROID_ROOT/platforms" -name android.jar -print | sort | tail -n 1)"
          KOTLINC_BIN="$(command -v kotlinc || true)"
          if [ -z "$KOTLINC_BIN" ]; then
            KOTLINC_BIN="/Applications/Android Studio.app/Contents/plugins/Kotlin/kotlinc/bin/kotlinc"
          fi
          test -f "$ANDROID_JAR"
          test -x "$KOTLINC_BIN"
          "$KOTLINC_BIN" \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadView.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadPresentation.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadBridgeConfig.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SubmissionOwnership.kt \
            -classpath "$ANDROID_JAR" \
            -jvm-target 17 -Werror -d /tmp/secure-keypad-android.jar
      - name: Android ownership contract
        run: |
          KOTLINC_BIN="$(command -v kotlinc || true)"
          if [ -z "$KOTLINC_BIN" ]; then
            KOTLINC_BIN="/Applications/Android Studio.app/Contents/plugins/Kotlin/kotlinc/bin/kotlinc"
          fi
          test -x "$KOTLINC_BIN"
          "$KOTLINC_BIN" \
            native/android/src/main/kotlin/com/uulab/securekeypad/SubmissionOwnership.kt \
            native/android/SubmissionOwnershipContractTest.kt \
            -include-runtime -d /tmp/secure-keypad-submission-contract.jar
          java -jar /tmp/secure-keypad-submission-contract.jar
      - name: Android presentation snapshot contract
        run: |
          KOTLINC_BIN="$(command -v kotlinc || true)"
          if [ -z "$KOTLINC_BIN" ]; then
            KOTLINC_BIN="/Applications/Android Studio.app/Contents/plugins/Kotlin/kotlinc/bin/kotlinc"
          fi
          test -x "$KOTLINC_BIN"
          "$KOTLINC_BIN" \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadPresentation.kt \
            native/android/SecureKeypadPresentationContractTest.kt \
            -include-runtime -d /tmp/secure-keypad-presentation-contract.jar
          java -jar /tmp/secure-keypad-presentation-contract.jar
      - name: Android bridge configuration contract
        run: |
          ANDROID_ROOT="$HOME/Library/Android/sdk"
          if [ -n "$ANDROID_HOME" ]; then ANDROID_ROOT="$ANDROID_HOME"; fi
          ANDROID_JAR="$(find "$ANDROID_ROOT/platforms" -name android.jar -print | sort | tail -n 1)"
          KOTLINC_BIN="$(command -v kotlinc || true)"
          if [ -z "$KOTLINC_BIN" ]; then
            KOTLINC_BIN="/Applications/Android Studio.app/Contents/plugins/Kotlin/kotlinc/bin/kotlinc"
          fi
          test -f "$ANDROID_JAR"
          test -x "$KOTLINC_BIN"
          "$KOTLINC_BIN" \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadView.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadPresentation.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadBridgeConfig.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SubmissionOwnership.kt \
            native/android/SecureKeypadBridgeConfigContractTest.kt \
            -classpath "$ANDROID_JAR" \
            -include-runtime -jvm-target 17 -Werror \
            -d /tmp/secure-keypad-bridge-config-contract.jar
          java -jar /tmp/secure-keypad-bridge-config-contract.jar
      - name: Android input-key randomization contract
        run: |
          ANDROID_ROOT="$HOME/Library/Android/sdk"
          if [ -n "$ANDROID_HOME" ]; then ANDROID_ROOT="$ANDROID_HOME"; fi
          ANDROID_JAR="$(find "$ANDROID_ROOT/platforms" -name android.jar -print | sort | tail -n 1)"
          KOTLINC_BIN="$(command -v kotlinc || true)"
          if [ -z "$KOTLINC_BIN" ]; then
            KOTLINC_BIN="/Applications/Android Studio.app/Contents/plugins/Kotlin/kotlinc/bin/kotlinc"
          fi
          test -f "$ANDROID_JAR"
          test -x "$KOTLINC_BIN"
          "$KOTLINC_BIN" \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadView.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadPresentation.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SecureKeypadBridgeConfig.kt \
            native/android/src/main/kotlin/com/uulab/securekeypad/SubmissionOwnership.kt \
            native/android/SecureKeypadRandomizationContractTest.kt \
            -classpath "$ANDROID_JAR" \
            -include-runtime -jvm-target 17 -Werror \
            -d /tmp/secure-keypad-randomization-contract.jar
          java -jar /tmp/secure-keypad-randomization-contract.jar

  ios-host-builds:
    name: Compile iOS RN and Flutter host integrations
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/contracts build
      - run: pnpm --dir packages/react-native build
      - name: Build the matching iOS FFI XCFramework
        run: |
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios-sim
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -library target/aarch64-apple-ios-sim/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -output "$RUNNER_TEMP/secure_ffi.xcframework"
      - name: Create the React Native iOS host
        env:
          HOST_DIR: ${{ runner.temp }}/secure-keypad-react-native-ios-host
          RN_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-react-native-ios-package
          CONTRACTS_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-contracts-ios-package
        run: |
          npx --yes @react-native-community/cli@20.2.0 init SecureKeypadHost \
            --version 0.87.0 --directory "$HOST_DIR" --skip-install
          mkdir -p "$RN_PACKAGE_DIR" "$CONTRACTS_PACKAGE_DIR"
          cp -R "$GITHUB_WORKSPACE/packages/react-native/." "$RN_PACKAGE_DIR/"
          cp -R "$GITHUB_WORKSPACE/packages/contracts/." "$CONTRACTS_PACKAGE_DIR/"
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" "$RN_PACKAGE_DIR/secure_ffi.xcframework"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          host = Path(os.environ["HOST_DIR"])
          rn_package = Path(os.environ["RN_PACKAGE_DIR"])
          contracts_package = Path(os.environ["CONTRACTS_PACKAGE_DIR"])
          rn_manifest_path = rn_package / "package.json"
          rn_manifest = json.loads(rn_manifest_path.read_text())
          rn_manifest["dependencies"]["@secure-keypad/contracts"] = f"file:{contracts_package}"
          rn_manifest_path.write_text(json.dumps(rn_manifest, indent=2) + "\n")
          host_manifest_path = host / "package.json"
          host_manifest = json.loads(host_manifest_path.read_text())
          host_manifest.setdefault("dependencies", {})["@secure-keypad/react-native"] = f"file:{rn_package}"
          host_manifest_path.write_text(json.dumps(host_manifest, indent=2) + "\n")
          (host / "App.tsx").write_text(
              """import React from 'react';
          import {SafeAreaView, StyleSheet} from 'react-native';
          import {
            getSecureKeypadView,
            type SecureKeypadProps,
          } from '@secure-keypad/react-native';
          import {
            DEFAULT_NUMERIC_LAYOUT,
            DEFAULT_THEME,
          } from '@secure-keypad/contracts';

          const SecureKeypadView = getSecureKeypadView();

          function App() {
            const props: SecureKeypadProps = {
              layout: DEFAULT_NUMERIC_LAYOUT,
              theme: DEFAULT_THEME,
              inputPolicy: 'numeric',
              maxTokens: 8,
              timeoutMs: 60_000,
              cancelRequest: 0,
            };

            return (
              <SafeAreaView style={styles.container}>
                <SecureKeypadView style={styles.keypad} {...props} />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {flex: 1},
            keypad: {flex: 1},
          });

          export default App;
          """
          )
          ui_test = host / "ios/SecureKeypadHostUITests/SecureKeypadHostUITests.swift"
          ui_test.parent.mkdir(parents=True, exist_ok=True)
          ui_test.write_text(
              """import XCTest

          final class SecureKeypadHostUITests: XCTestCase {
              func testSecureKeypadRuntime() {
                  let app = XCUIApplication(bundleIdentifier: "org.reactjs.native.example.SecureKeypadHost")
                  app.activate()

                  let digitOne = app.buttons["digit-1"]
                  XCTAssertTrue(digitOne.waitForExistence(timeout: 15))
                  XCTAssertTrue(app.buttons["Continue"].exists)
                  XCTAssertTrue(app.buttons["Cancel"].exists)

                  digitOne.tap()
                  let maskedState = app.descendants(matching: .any)["1 characters entered"]
                  XCTAssertTrue(maskedState.waitForExistence(timeout: 5))
                  XCTAssertFalse(app.staticTexts["digit-1"].exists)
              }
          }
          """
          )
          podfile = host / "ios/Podfile"
          podfile.write_text(re.sub(r"^platform :ios,.*$", "platform :ios, '15.1'", podfile.read_text(), flags=re.MULTILINE))
          project = host / "ios/SecureKeypadHost.xcodeproj/project.pbxproj"
          project.write_text(re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;", "IPHONEOS_DEPLOYMENT_TARGET = 15.1;", project.read_text()))
          PY
      - name: Link and compile the React Native iOS host
        working-directory: ${{ runner.temp }}/secure-keypad-react-native-ios-host
        run: |
          npm install --install-links --no-audit --no-fund
          npx react-native config > "$RUNNER_TEMP/react-native-ios-config.json"
          grep -q '"@secure-keypad/react-native"' "$RUNNER_TEMP/react-native-ios-config.json"
          cd ios
          pod install
          ruby - <<'RUBY'
          require "xcodeproj"

          project_path = "SecureKeypadHost.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          app_target = project.targets.find { |target| target.name == "SecureKeypadHost" }
          abort "SecureKeypadHost target is missing" unless app_target
          abort "SecureKeypadHostUITests target already exists" if project.targets.any? { |target| target.name == "SecureKeypadHostUITests" }

          ui_target = project.new_target(:ui_test_bundle, "SecureKeypadHostUITests", :ios, "15.1")
          ui_target.product_type = "com.apple.product-type.bundle.ui-testing"
          ui_target.deployment_target = "15.1"
          ui_target.build_configurations.each do |configuration|
            settings = configuration.build_settings
            settings["PRODUCT_BUNDLE_IDENTIFIER"] = "org.reactjs.native.example.SecureKeypadHostUITests"
            settings["PRODUCT_NAME"] = "SecureKeypadHostUITests"
            settings["GENERATE_INFOPLIST_FILE"] = "YES"
            settings["SWIFT_VERSION"] = "5.0"
            settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
            settings["TARGETED_DEVICE_FAMILY"] = "1"
            settings["CODE_SIGN_STYLE"] = "Automatic"
          end
          source_group = project.main_group.new_group("SecureKeypadHostUITests", "SecureKeypadHostUITests")
          source_file = source_group.new_file("SecureKeypadHostUITests.swift")
          ui_target.source_build_phase.add_file_reference(source_file)
          ui_target.add_dependency(app_target)
          project.save

          scheme_path = "SecureKeypadHost.xcodeproj/xcshareddata/xcschemes/SecureKeypadHost.xcscheme"
          scheme = Xcodeproj::XCScheme.new(scheme_path)
          scheme.test_action.testables = []
          scheme.add_build_target(ui_target, false)
          scheme.add_test_target(ui_target)
          scheme.set_launch_target(app_target)
          scheme.save!
          RUBY
          xcodebuild -workspace SecureKeypadHost.xcworkspace \
            -scheme SecureKeypadHost \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/secure-keypad-rn-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 build
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); [print(device["udid"]) or sys.exit() for runtime in data.get("devices", {}).values() for device in runtime if device.get("isAvailable") and device.get("name", "").startswith("iPhone ")]')"
          test -n "$SIMULATOR_ID"
          xcodebuild -workspace SecureKeypadHost.xcworkspace \
            -scheme SecureKeypadHost \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/secure-keypad-rn-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 test
      - name: Launch the React Native host in an iOS Simulator
        env:
          APP_PATH: ${{ runner.temp }}/secure-keypad-rn-ios-derived/Build/Products/Release-iphonesimulator/SecureKeypadHost.app
          SCREENSHOT_PATH: ${{ runner.temp }}/secure-keypad-ios-simulator-runtime/react-native.png
        run: |
          test -d "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          bash "$GITHUB_WORKSPACE/scripts/ios-simulator-runtime-smoke.sh" \
            "$APP_PATH" "$BUNDLE_ID" "$SCREENSHOT_PATH"
      - name: Create and compile the Flutter iOS host
        env:
          HOST_DIR: ${{ runner.temp }}/secure-keypad-flutter-ios-host
          FLUTTER_PACKAGE_DIR: ${{ runner.temp }}/secure-keypad-flutter-ios-package
        run: |
          FLUTTER_SWIFT_PACKAGE_MANAGER=false flutter create --platforms=ios --org dev.uulab --project-name secure_keypad_host "$HOST_DIR"
          mkdir -p "$FLUTTER_PACKAGE_DIR"
          cp -R "$GITHUB_WORKSPACE/packages/flutter/." "$FLUTTER_PACKAGE_DIR/"
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" "$FLUTTER_PACKAGE_DIR/ios/secure_ffi.xcframework"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          host = Path(os.environ["HOST_DIR"])
          pubspec = host / "pubspec.yaml"
          contents = pubspec.read_text()
          dependency = (
              "dependencies:\n"
              "  secure_keypad_flutter:\n"
              f"    path: {Path(os.environ['FLUTTER_PACKAGE_DIR'])}\n"
          )
          pubspec.write_text(contents.replace("dependencies:\n", dependency, 1))
          PY
          cd "$HOST_DIR"
          FLUTTER_SWIFT_PACKAGE_MANAGER=false flutter pub get
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          host = Path(os.environ["HOST_DIR"])
          podfile = host / "ios/Podfile"
          podfile_contents = re.sub(r"^platform :ios,.*$", "platform :ios, '15.1'", podfile.read_text(), flags=re.MULTILINE)
          podfile_contents = podfile_contents.replace(
              "    flutter_additional_ios_build_settings(target)\n",
              "    flutter_additional_ios_build_settings(target)\n"
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['ARCHS'] = 'arm64'\n"
              "      config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'\n"
              "    end\n",
          )
          podfile.write_text(podfile_contents)
          project = host / "ios/Runner.xcodeproj/project.pbxproj"
          project_contents = re.sub(
              r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.1;",
              project.read_text(),
          )
          project_contents = re.sub(
              r"(?m)^(\s*)IPHONEOS_DEPLOYMENT_TARGET = 15\.1;",
              r"\1IPHONEOS_DEPLOYMENT_TARGET = 15.1;\n\1ARCHS = arm64;\n\1ONLY_ACTIVE_ARCH = YES;",
              project_contents,
          )
          project_contents = project_contents.replace(
              'productType = "com.apple.product-type.bundle.unit-test";',
              'productType = "com.apple.product-type.bundle.ui-testing";',
          )
          project_contents = re.sub(
              r'(?m)^\s+BUNDLE_LOADER = "\$\(TEST_HOST\)";\n',
              "",
              project_contents,
          )
          project_contents = re.sub(
              r'(?m)^\s+TEST_HOST = "\$\(BUILT_PRODUCTS_DIR\)/Runner\.app/\$\(BUNDLE_EXECUTABLE_FOLDER_PATH\)/Runner";\n',
              "",
              project_contents,
          )
          project.write_text(project_contents)
          (host / "lib/main.dart").write_text('''
          import 'package:flutter/material.dart';
          import 'package:secure_keypad_flutter/secure_keypad_flutter.dart';

          void main() => runApp(const SecureKeypadHostSmoke());

          class SecureKeypadHostSmoke extends StatefulWidget {
            const SecureKeypadHostSmoke({super.key});

            @override
            State<SecureKeypadHostSmoke> createState() => _SecureKeypadHostSmokeState();
          }

          class _SecureKeypadHostSmokeState extends State<SecureKeypadHostSmoke> {
            final controller = SecureKeypadController();

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                home: Scaffold(
                  body: SafeArea(
                    child: SecureKeypad(
                      configuration: SecureKeypadConfiguration.defaultNumeric(),
                      controller: controller,
                    ),
                  ),
                ),
              );
            }
          }
          ''')
          (host / "ios/RunnerTests/RunnerTests.swift").write_text('''
          import XCTest

          final class RunnerTests: XCTestCase {
            func testSecureKeypadRuntime() {
              let app = XCUIApplication(bundleIdentifier: "dev.uulab.secureKeypadHost")
              app.activate()

              let digitOne = app.buttons["digit-1"]
              XCTAssertTrue(digitOne.waitForExistence(timeout: 10))
              XCTAssertTrue(app.buttons["Continue"].exists)
              XCTAssertTrue(app.buttons["Cancel"].exists)

              digitOne.tap()
              let maskedState = app.descendants(matching: .any)["1 characters entered"]
              XCTAssertTrue(maskedState.waitForExistence(timeout: 3))
              XCTAssertFalse(app.staticTexts["digit-1"].exists)
            }
          }
          ''')
          PY
          cd ios
          pod install
          xcodebuild -project Pods/Pods.xcodeproj -scheme secure_keypad_flutter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            BUILD_DIR="$HOST_DIR/build/ios" \
            OBJROOT="$HOST_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          cd "$HOST_DIR"
          FLUTTER_SWIFT_PACKAGE_MANAGER=false flutter build ios --simulator --no-codesign
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["HOST_DIR"]) / "ios/Runner.xcodeproj/project.pbxproj"
          project_contents = project.read_text()
          test_target_start = project_contents.index(
              "\t\t331C8080294A63A400263BE5 /* RunnerTests */ = {"
          )
          test_target_end = project_contents.index("\n\t\t};", test_target_start)
          test_target = project_contents[test_target_start:test_target_end]
          test_target = re.sub(
              r"\n\s+[A-F0-9]+ /\* \[CP\] Check Pods Manifest\.lock \*/,\n",
              "\n",
              test_target,
          )
          project_contents = (
              project_contents[:test_target_start]
              + test_target
              + project_contents[test_target_end:]
          )
          framework_phase_start = None
          framework_phase_end = None
          for match in re.finditer(
              r"(?m)^\t\t[A-F0-9]+ /\* Frameworks \*/ = \{\n\t\t\tisa = PBXFrameworksBuildPhase;",
              project_contents,
          ):
              candidate_end = project_contents.index("\n\t\t};", match.start())
              candidate = project_contents[match.start():candidate_end]
              if "Pods_RunnerTests.framework in Frameworks" in candidate:
                  framework_phase_start = match.start()
                  framework_phase_end = candidate_end
                  break
          if framework_phase_start is None or framework_phase_end is None:
              raise ValueError("RunnerTests framework phase not found")
          framework_phase = project_contents[framework_phase_start:framework_phase_end]
          framework_phase = re.sub(
              r"\n\s+[A-F0-9]+ /\* Pods_RunnerTests\.framework in Frameworks \*/,\n",
              "\n",
              framework_phase,
          )
          project_contents = (
              project_contents[:framework_phase_start]
              + framework_phase
              + project_contents[framework_phase_end:]
          )
          project_contents = re.sub(
              r'(?m)^\s+baseConfigurationReference = [A-F0-9]+ /\* Pods-RunnerTests\.[^*]+ \*/;\n',
              "",
              project_contents,
          )
          project.write_text(project_contents)
          PY
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          for runtime in data.get("devices", {}).values():
              for device in runtime:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone "):
                      print(device["udid"])
                      raise SystemExit
          ' )"
          test -n "$SIMULATOR_ID"
          xcodebuild -workspace "$HOST_DIR/ios/Runner.xcworkspace" \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            BUILD_DIR="$HOST_DIR/build/ios" \
            OBJROOT="$HOST_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test
      - name: Launch the Flutter host in an iOS Simulator
        env:
          APP_PATH: ${{ runner.temp }}/secure-keypad-flutter-ios-host/build/ios/iphonesimulator/Runner.app
          SCREENSHOT_PATH: ${{ runner.temp }}/secure-keypad-ios-simulator-runtime/flutter.png
        run: |
          test -d "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          bash "$GITHUB_WORKSPACE/scripts/ios-simulator-runtime-smoke.sh" \
            "$APP_PATH" "$BUNDLE_ID" "$SCREENSHOT_PATH"
      - name: Upload iOS Simulator runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-ios-simulator-runtime
          path: ${{ runner.temp }}/secure-keypad-ios-simulator-runtime
          if-no-files-found: warn
  ci-release-evidence:
    name: Assemble CI release evidence fragments
    needs:
      [
        rust,
        durable-backends,
        contracts,
        web-browser-matrix,
        flutter,
        flutter-host-build,
        react-native-host-build,
        android-host-runtime-smoke,
        fuzz,
        sbom,
        ffi-header,
        native-platforms,
        ios-host-builds,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: secure-keypad-browser-smoke-*
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence/browser
          merge-multiple: true
      - name: Retain Android emulator runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-android-emulator-runtime
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence/retained/android-emulator-runtime
      - name: Retain iOS simulator runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-ios-simulator-runtime
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence/retained/ios-simulator-runtime
      - name: Retain fuzz and LeakSanitizer campaign logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-fuzz-logs
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence/retained/fuzz-logs
      - name: Retain commit-bound fuzz gate records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-ci-gate-fuzz
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence
      - name: Retain dependency metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-dependency-metadata
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence/retained/dependency-metadata
      - name: Emit source and service CI release evidence fragments
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/secure-keypad-ci-release-evidence"
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" rust-workspace \
            "ci/rust-workspace.json" "fragments/rust-workspace.json" \
            --runner ci-aggregate --check job-rust
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" javascript-contracts \
            "ci/javascript-contracts.json" "fragments/javascript-contracts.json" \
            --runner ci-aggregate --check job-contracts
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" http-contract-version-parity \
            "ci/http-contract-version-parity.json" "fragments/http-contract-version-parity.json" \
            --runner ci-aggregate --check job-contracts
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" opaque-protocol-parity \
            "ci/opaque-protocol-parity.json" "fragments/opaque-protocol-parity.json" \
            --runner ci-aggregate --check job-contracts
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" native-parity \
            "ci/native-parity.json" "fragments/native-parity.json" \
            --runner ci-aggregate --check job-contracts
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" release-version-parity \
            "ci/release-version-parity.json" "fragments/release-version-parity.json" \
            --runner ci-aggregate --check job-contracts
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" framework-host-builds \
            "ci/framework-host-builds.json" "fragments/framework-host-builds.json" \
            --runner ci-aggregate --check job-flutter-host-build --check job-react-native-host-build --check job-ios-host-builds --check job-android-host-runtime-smoke
          node scripts/emit-ci-gate-evidence.mjs "$EVIDENCE_ROOT" durable-backends \
            "ci/durable-backends-aggregate.json" "fragments/durable-backends-aggregate.json" \
            --runner ci-aggregate --check job-durable-backends
      - name: Emit web browser CI release evidence
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/secure-keypad-ci-release-evidence"
          node scripts/emit-web-browser-evidence.mjs "$EVIDENCE_ROOT" \
            "ci/web-browser-matrix.json" "fragments/web-browser-matrix.json" \
            --framework-version playwright-1.62.1 \
            --runner ubuntu-24.04 \
            --log chromium=browser/chromium.log \
            --log firefox=browser/firefox.log \
            --log webkit=browser/webkit.log
      - uses: actions/upload-artifact@ea165f8f65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-ci-release-evidence
          path: ${{ runner.temp }}/secure-keypad-ci-release-evidence
          if-no-files-found: error
