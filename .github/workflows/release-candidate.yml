name: Release candidate bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact 40-character commit SHA to bundle"
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-ios-artifacts:
    name: Build release iOS FFI artifacts
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IOS_FFI_DIR: ${{ runner.temp }}/secure-keypad-release-ios-ffi
      RELEASE_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require immutable release commit
        run: |
          test -n "$RELEASE_REF"
          if ! [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release ref must be a 40-character lowercase commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build release FFI libraries for device and simulator
        run: |
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios
          cargo build --locked --release -p secure-ffi --target aarch64-apple-ios-sim
      - name: Assemble release XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -library target/aarch64-apple-ios-sim/release/libsecure_ffi.a \
            -headers crates/secure-ffi/include \
            -output "$RUNNER_TEMP/secure_ffi.xcframework"
          test -s "$RUNNER_TEMP/secure_ffi.xcframework/Info.plist"
          test -s target/aarch64-apple-ios/release/libsecure_ffi.a
      - name: Stage publishable iOS FFI artifacts
        run: |
          mkdir -p "$IOS_FFI_DIR/react-native" "$IOS_FFI_DIR/flutter/ios"
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" "$IOS_FFI_DIR/react-native/secure_ffi.xcframework"
          cp target/aarch64-apple-ios/release/libsecure_ffi.a "$IOS_FFI_DIR/react-native/libsecure_ffi.a"
          cp -R "$RUNNER_TEMP/secure_ffi.xcframework" "$IOS_FFI_DIR/flutter/ios/secure_ffi.xcframework"
          cp target/aarch64-apple-ios/release/libsecure_ffi.a "$IOS_FFI_DIR/flutter/ios/libsecure_ffi.a"
          printf '%s\n' "$RELEASE_REF" > "$IOS_FFI_DIR/secure-keypad-ios-ffi.commit"
          (
            cd "$IOS_FFI_DIR"
            find . -type f ! -name secure-keypad-ios-ffi.sha256 -print0 \
              | sort -z \
              | xargs -0 shasum -a 256
          ) > "$IOS_FFI_DIR/secure-keypad-ios-ffi.sha256"
          cat "$IOS_FFI_DIR/secure-keypad-ios-ffi.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-release-ios-ffi
          path: ${{ runner.temp }}/secure-keypad-release-ios-ffi
          if-no-files-found: error

  bundle:
    needs: native-ios-artifacts
    name: Build and sign release candidate bundle
    runs-on: ubuntu-24.04
    environment: secure-keypad-release
    timeout-minutes: 60
    env:
      RELEASE_DIR: ${{ runner.temp }}/secure-keypad-release
      IOS_FFI_DIR: ${{ runner.temp }}/secure-keypad-release-ios-ffi
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require immutable release commit
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          test -n "$RELEASE_REF"
          if ! [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release ref must be a 40-character lowercase commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: pnpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-keypad-release-ios-ffi
          path: ${{ runner.temp }}/secure-keypad-release-ios-ffi
      - name: Verify and stage publishable iOS FFI artifacts
        env:
          IOS_FFI_DIR: ${{ runner.temp }}/secure-keypad-release-ios-ffi
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          test -s "$IOS_FFI_DIR/secure-keypad-ios-ffi.sha256"
          (
            cd "$IOS_FFI_DIR"
            shasum -a 256 -c secure-keypad-ios-ffi.sha256
          )
          test "$(cat "$IOS_FFI_DIR/secure-keypad-ios-ffi.commit")" = "$RELEASE_REF"
          test -s "$IOS_FFI_DIR/react-native/secure_ffi.xcframework/Info.plist"
          test -s "$IOS_FFI_DIR/react-native/libsecure_ffi.a"
          test -s "$IOS_FFI_DIR/flutter/ios/secure_ffi.xcframework/Info.plist"
          test -s "$IOS_FFI_DIR/flutter/ios/libsecure_ffi.a"
          cp -R "$IOS_FFI_DIR/react-native/secure_ffi.xcframework" packages/react-native/secure_ffi.xcframework
          cp "$IOS_FFI_DIR/react-native/libsecure_ffi.a" packages/react-native/libsecure_ffi.a
          cp -R "$IOS_FFI_DIR/flutter/ios/secure_ffi.xcframework" packages/flutter/ios/secure_ffi.xcframework
          cp "$IOS_FFI_DIR/flutter/ios/libsecure_ffi.a" packages/flutter/ios/libsecure_ffi.a
      - name: Run release source gates
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-features
          cargo test --locked -p secure-auth-actix --all-features
          SECURE_KEYPAD_REDIS_URL=redis://127.0.0.1:6379 \
          SECURE_KEYPAD_POSTGRES_URL='host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres' \
            cargo test --locked -p secure-webauthn-example --all-features --test durable_storage -- --ignored --nocapture
          SECURE_KEYPAD_REDIS_URL=redis://127.0.0.1:6379 \
          SECURE_KEYPAD_POSTGRES_URL='host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres' \
            cargo test --locked -p secure-auth-server --all-features --test durable_rate_limit -- --ignored --nocapture
          SECURE_KEYPAD_REDIS_URL=redis://127.0.0.1:6379 \
          SECURE_KEYPAD_POSTGRES_URL='host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres' \
            cargo test --locked -p secure-auth-server --all-features --test durable_one_time_state -- --ignored --nocapture
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          pnpm audit --audit-level high
          pnpm test:native-parity
          pnpm check:native-parity
          pnpm test:release-version-parity
          pnpm check:release-version-parity
          pnpm test:release-evidence
          pnpm test:release-bundle
          pnpm test:release-archive
          pnpm test:release-candidate-metadata
          pnpm test:emit-release-artifact-fragment
          pnpm test:expo-development-build
          pnpm test:emit-release-gate-evidence
          pnpm test:emit-ci-gate-evidence
          pnpm test:emit-web-browser-evidence
          pnpm test:merge-release-evidence
          pnpm test:sign-release
          pnpm test:emit-signed-release-evidence
          pnpm test:device-evidence
          pnpm test:fuzz-corpus
          pnpm test:flutter-package-publish-contract
          pnpm test:security-audit
          pnpm security-audit
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:web-browser all
      - name: Run Flutter release gates
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          dart pub publish --dry-run
        working-directory: packages/flutter
      - name: Prepare release output directory
        run: mkdir -p "$RELEASE_DIR"
      - name: Generate SPDX release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.RELEASE_DIR }}/secure-keypad.sbom.spdx.json
          upload-artifact: false
      - name: Assemble deterministic source and package bundle
        run: |
          mkdir -p "$RELEASE_DIR/packages" "$RELEASE_DIR/source"
          pnpm --dir packages/contracts pack --pack-destination "$RELEASE_DIR/packages"
          pnpm --dir packages/react-native pack --pack-destination "$RELEASE_DIR/packages"
          pnpm --dir packages/web pack --pack-destination "$RELEASE_DIR/packages"
          pnpm --dir packages/server-node pack --pack-destination "$RELEASE_DIR/packages"
          cargo package --locked --workspace --all-features --target-dir "$RUNNER_TEMP/secure-keypad-cargo-target"
          cp "$RUNNER_TEMP/secure-keypad-cargo-target/package/"*.crate "$RELEASE_DIR/packages/"
          cp Cargo.lock pnpm-lock.yaml LICENSE-MIT "$RELEASE_DIR/source/"
          cp CHANGELOG.md "$RELEASE_DIR/source/CHANGELOG.md"
          cp README.md "$RELEASE_DIR/source/README.md"
          cp SECURITY.md "$RELEASE_DIR/source/SECURITY.md"
          cp "$RELEASE_DIR/secure-keypad.sbom.spdx.json" "$RELEASE_DIR/source/secure-keypad.sbom.spdx.json"
          cp "$IOS_FFI_DIR/secure-keypad-ios-ffi.sha256" "$RELEASE_DIR/source/secure-keypad-ios-ffi.sha256"
          mkdir -p "$RELEASE_DIR/source/packages"
          cp -R packages/flutter "$RELEASE_DIR/source/packages/flutter"
          cp -R docs "$RELEASE_DIR/source/docs"
          cp docs/THIRD-PARTY-NOTICES.md "$RELEASE_DIR/source/THIRD-PARTY-NOTICES.md"
          node scripts/release-candidate-metadata.mjs "$RELEASE_DIR/source/release-candidate-metadata.json"
          node scripts/check-release-bundle.mjs "$RELEASE_DIR"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RELEASE_DIR/secure-keypad-release.tar.gz" -C "$RELEASE_DIR" source packages
          node scripts/check-release-archive.mjs "$RELEASE_DIR/secure-keypad-release.tar.gz"
      - name: Sign release bundle with the protected maintainer key
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_PEM"
          umask 077
          KEY_FILE="$RUNNER_TEMP/secure-keypad-release-signing-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY_PEM" > "$KEY_FILE"
          node scripts/sign-release.mjs \
            "$RELEASE_DIR/secure-keypad-release.tar.gz" \
            "$KEY_FILE" \
            "$RELEASE_DIR/secure-keypad-release.sig" \
            "$RELEASE_DIR/secure-keypad-release.pub.der"
      - name: Emit release artifact checksums
        run: |
          (
            cd "$RELEASE_DIR"
            find . -type f ! -name secure-keypad-release.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > secure-keypad-release.sha256
          )
          cat "$RELEASE_DIR/secure-keypad-release.sha256"
      - name: Emit signed-release evidence
        run: |
          node scripts/emit-signed-release-evidence.mjs \
            "$RELEASE_DIR" \
            "evidence/signed-release.json" \
            --bundle secure-keypad-release.tar.gz \
            --signature secure-keypad-release.sig \
            --public-key secure-keypad-release.pub.der
      - name: Emit candidate public artifact fragment
        run: |
          node scripts/emit-release-artifact-fragment.mjs \
            "$RELEASE_DIR" \
            "fragments/candidate-artifacts.json" \
            --artifact native-checksum=source/secure-keypad-ios-ffi.sha256 \
            --artifact sbom=source/secure-keypad.sbom.spdx.json \
            --artifact license-notices=source/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-keypad-release-candidate
          path: ${{ runner.temp }}/secure-keypad-release
          if-no-files-found: error
