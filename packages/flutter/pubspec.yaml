name: secure_keypad_flutter
description: Secure Native Flutter contract for a customizable virtual keypad.
version: 0.1.0
repository: https://github.com/uulab-official/secure-keyboard
issue_tracker: https://github.com/uulab-official/secure-keyboard/issues
license: MIT

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.uulab.securekeypad.flutter
        pluginClass: SecureKeypadFlutterPlugin
      ios:
        pluginClass: SecureKeypadFlutterPlugin
