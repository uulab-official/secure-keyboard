apply plugin: 'com.android.library'

// AGP 9 hosts may use built-in Kotlin. Older hosts must expose the Kotlin
// Gradle plugin in their plugin management block before consuming this module.
def builtInKotlinEnabled = (project.findProperty('android.builtInKotlin') ?: 'false').toString().toBoolean()
if (!builtInKotlinEnabled) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

group = 'com.uulab.securekeypad'
version = '0.1.0'

android {
    namespace 'com.uulab.securekeypad'
    compileSdk project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35

    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
        targetSdk project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c11'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
