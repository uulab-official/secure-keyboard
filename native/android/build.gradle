apply plugin: 'com.android.library'

// AGP 9 hosts may use built-in Kotlin. Older hosts must expose the Kotlin
// Android plugin in their plugin management block before consuming this module.
def builtInKotlinEnabled = (project.findProperty('android.builtInKotlin') ?: 'false').toString().toBoolean()
if (!builtInKotlinEnabled) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

group = 'com.uulab.securekeypad'
version = '0.1.0'

def secureKeypadAbiFilters = (project.findProperty('secureKeypadAndroidArchitectures') ?: 'arm64-v8a,x86_64')
    .toString()
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

android {
    namespace 'com.uulab.securekeypad'
    compileSdk project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35

    // The standalone native module owns the renderer and FFI only. Framework
    // adapters are published by their respective packages and must never be
    // pulled into this AAR's compile classpath.
    sourceSets {
        main {
            java {
                exclude 'com/uulab/securekeypad/flutter/**'
                exclude 'com/uulab/securekeypad/reactnative/**'
            }
            kotlin {
                exclude 'com/uulab/securekeypad/flutter/**'
                exclude 'com/uulab/securekeypad/reactnative/**'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
        targetSdk project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters(*secureKeypadAbiFilters)
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c11'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Kotlin 2.x maintains its own source file collection in addition to the
// Android Java source set. Apply the boundary to the compile task itself so
// framework adapters can remain available for wrapper package parity without
// entering the standalone AAR.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude '**/flutter/**'
    exclude '**/reactnative/**'
}
