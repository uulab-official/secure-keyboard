services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_keypad
      POSTGRES_PASSWORD: secure_keypad_local_only
      POSTGRES_USER: secure_keypad
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_keypad -d secure_keypad"]
      interval: 5s
      timeout: 3s
      retries: 20
