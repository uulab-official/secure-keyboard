[package]
name = "secure-webauthn-example"
version = "0.1.0"
description = "Passkey registration and authentication reference service for Secure Keypad"
license = "MIT"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# webauthn-rs-core uses OpenSSL for credential verification. Vendoring keeps
# native builds independent from an unpinned host OpenSSL installation.
openssl = { version = "0.10.75", features = ["vendored"] }
rand = "0.8.7"
secure-auth-server = { path = "../secure-auth-server", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
url = "2.5.7"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.6.0"

[lints]
workspace = true
