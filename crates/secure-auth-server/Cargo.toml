[package]
name = "secure-auth-server"
version = "0.1.0"
description = "Replay-resistant reference storage boundary for Secure Keypad server integrations"
license = "MIT"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
redis-backend = ["dep:r2d2", "dep:redis", "dep:sha2"]
postgres-backend = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres", "dep:sha2"]

[dependencies]
postgres = { version = "=0.19.14", optional = true }
rand = "0.8.7"
redis = { version = "=1.2.2", default-features = false, features = ["r2d2", "script", "tls-rustls", "tls-rustls-webpki-roots"], optional = true }
r2d2 = { version = "=0.8.10", optional = true }
r2d2_postgres = { version = "=0.18.2", optional = true }
secure-auth = { path = "../secure-auth", version = "0.1.0" }
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
secure-core = { path = "../secure-core", version = "0.1.0" }
uuid = { version = "1.16.0", features = ["v4"] }

[lints]
workspace = true
