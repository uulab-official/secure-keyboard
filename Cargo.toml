[workspace]
members = [
    "crates/secure-core",
    "crates/secure-auth",
    "crates/secure-auth-server",
    "crates/secure-auth-http",
    "crates/secure-auth-axum",
    "crates/secure-ffi",
    "crates/secure-webauthn-example",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/uulab-official/secure-keyboard"
homepage = "https://github.com/uulab-official/secure-keyboard"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
